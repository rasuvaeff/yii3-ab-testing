# Prose linting for the family documentation site (#25).
#
# The site is EN-only — the Russian halves live in README.ru.md and
# docs/integration.ru.md, which the site does not render. Scope: hand-written
# pages only (docs/index.md, docs/guide/, docs/integration.md); packages/,
# llms/ and api/ are generated from READMEs and docblocks. The scope is set by
# the paths on the command line — see .github/workflows/docs.yml and
# `make docs-vale`.
#
# Rule set and exclusions follow property-testing-core's .vale.ini: each
# exclusion is a house-style decision, not a way to make the run green.

StylesPath = docs/.vale/styles
MinAlertLevel = warning
# Pinned release URL, not the bare `Microsoft` alias: the gate sits at zero
# findings, and an upstream rule change would redden master with no local edit.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = AbTesting

[*.md]
BasedOnStyles = Vale, Microsoft

# Spaced em dashes are this documentation's punctuation for an aside.
Microsoft.Dashes = NO

# Written in the register of the AGENTS.md files: "do not", not "don't".
Microsoft.Contractions = NO

# "Silently" and "deliberately" distinguish a reported failure from an
# unreported one; they are load-bearing here.
Microsoft.Adverbs = NO

# Headings put code after the colon ("DI: one source per key").
Microsoft.HeadingColons = NO

# The docs quote exact strings; moving punctuation inside the quotes changes them.
Microsoft.Quotes = NO

# "DI", "API" and "SQL" in a heading are clearer than their expansions.
Microsoft.HeadingAcronyms = NO
